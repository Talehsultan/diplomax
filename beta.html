async function signedAvatar(path) {
  if (!path) return '';
  if (C.avatars[path]) return C.avatars[path];
  const { data } = await sb.storage.from('avatars').createSignedUrl(path, 3600);
  return (C.avatars[path] = data ? data.signedUrl : '');
}
async function preloadAvatars(paths) {
  const need = [...new Set(paths.filter(p => p && !C.avatars[p]))];
  if (!need.length) return;
  const { data } = await sb.storage.from('avatars').createSignedUrls(need, 3600);
  (data || []).forEach(x => { if (x.signedUrl) C.avatars[x.path] = x.signedUrl; });
}

async function loadAdminGroups() {

async function loadGroupChat(gid) {
  const [msgs, cards] = await Promise.all([
    q(sb.from('group_messages').select('*').eq('group_id', gid).is('deleted_at', null).order('created_at').limit(300)),
    q(sb.rpc('group_member_cards', { gid }))
  ]);
  C.gmsgs = msgs; C.gcards[gid] = cards;
  await preloadAvatars(cards.map(c => c.avatar_path));
}

  ${L.length ? `<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>TƏLƏBƏ</th><th>İSTİQAMƏT</th><th>MƏRHƏLƏ</th><th>SƏNƏDLƏR</th><th>TÜRK DİLİ</th><th>DİQQƏT</th></tr></thead><tbody>

async function loadAllProgs() {
  if (C.allProgs) return;
  const out = [];
  for (let from = 0; ; from += 1000) { const part = await q(sb.from('university_programs').select('university_id, degree, name, language, years, annual_fee, thesis').order('id').range(from, from + 999)); out.push(...part); if (part.length < 1000) break; }
  C.allProgs = out;
}
async function loadPubProgs() {
  if (C.pubProgs) return;
  await loadAllProgs();
  const intl = [];
  for (let from = 0; ; from += 1000) { const part = await q(sb.from('intl_programs').select('university_id, degree, name, language, thesis, fee_usd, fee_min_usd, fee_note, basis, years, academic_year, source_url').order('id').range(from, from + 999)); intl.push(...part); if (part.length < 1000) break; }
  const has = new Set(intl.map(p => p.university_id + '|' + p.degree));
  C.pubProgs = intl.concat(C.allProgs.filter(p => !has.has(p.university_id + '|' + p.degree)).map(p => ({ ...p, fee_usd: null, osym: true })));
}
async function loadWish() { C.wish = await q(sb.from('program_wishlist').select('*').eq('student_id', ui.preview || C.me.id).order('created_at')); }
const wishKey = (uid, deg, name) => uid + '|' + deg + '|' + name;
function searchResults() {
  const s = ui.srch, term = (s.q || '').toLocaleLowerCase('tr').trim();

function readImage(file, max, cb) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(cb, 'image/jpeg', .85); }; img.onerror = () => toast('Şəkli oxumaq alınmadı'); img.src = r.result; };
  r.readAsDataURL(file);
}

      const rec = await q(sb.rpc('accept_consent', { p_version: PRIVACY_VERSION, p_items: items, p_guardian: g ? g.value : null, p_ua: navigator.userAgent, p_text: text })).finally(() => { btn.disabled = false; });
      C.myConsent = rec; if (C.bundle) C.bundle.consent = rec;
      ui.consentDone = rec; render(); if (!C.bundle) { await reloadPortal(); if (!ui.consentDone) render(); } return;
    }
    if (form.id === 'recoverForm') {
      const p = document.getElementById('rc-pass').value, err = document.getElementById('rc-err');
      if (p.length < 8 || p !== document.getElementById('rc-pass2').value) { err.textContent = p.length < 8 ? 'Parol ən azı 8 simvol olmalıdır.' : 'Parollar eyni deyil.'; err.hidden = false; return; }
      const { error } = await sb.auth.updateUser({ password: p });
      if (error) { err.textContent = 'Xəta: ' + error.message; err.hidden = false; return; }
      ui.recovering = false; history.replaceState(null, '', location.pathname); toast('Parol yeniləndi'); await boot(); return;
    }
    if (form.id === 'pwForm') {
      const v = document.getElementById('newpw').value; if (v.length < 8) return toast('Parol ən azı 8 simvol olmalıdır');
      const { error } = await sb.auth.updateUser({ password: v }); if (error) return toast('Xəta: ' + error.message);
      form.reset(); return toast('Parol dəyişdirildi');
    }
    if (form.id === 'newForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('nf-err');
      if (!v('email') || !v('first_name') || !v('last_name')) { err.textContent = 'E-poçt, ad və soyadı doldur.'; err.hidden = false; return; }
      const choices = [0, 1, 2].map(i => { const u = C.unis.find(x => x.id === v('uni' + i)); return u ? { university_name: u.name, city: u.city, program_name: v('prog' + i) || firstProg(C.progs[u.id] || [], v('degree')) || '—' } : null; }).filter(Boolean);
      const btn = document.getElementById('nf-submit'); btn.disabled = true; btn.textContent = 'Yaradılır…';
      const body = { email: v('email'), first_name: v('first_name'), last_name: v('last_name'), father_name: v('father_name'), mother_name: v('mother_name'), birth_date: v('birth_date') || null, phone: v('phone'), parent_phone: v('parent_phone'), registration_address: v('registration_address'), contract_signed_at: v('contract_signed_at') || null, country: v('country') || null, degree: v('degree') || null, intake_year: +v('intake_year') || null, turkish_mode: v('turkish_mode'), choices };
      const r = await sb.functions.invoke('create-student', { body });
      const msg = r.data && r.data.error ? r.data.error : r.error ? (await (async () => { try { const j = await r.error.context.json(); return j.error; } catch (x) { return r.error.message; } })()) : null;
      if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Tələbəni yarat və giriş ver'; return; }
      ui.modal = null; ui.created = { title: body.first_name + ' ' + body.last_name + ' yaradıldı · ' + (r.data.student_code || ''), email: r.data.email, temp_password: r.data.temp_password };
      if (ui.leadConv) { await q(sb.from('leads').update({ status: 'contract', converted_student_id: r.data.id }).eq('id', ui.leadConv)); ui.leadConv = null; await loadLeads(); }
      await loadStudents(); ui.open = r.data.id; ui.ctab = 'docs'; ui.atab = 'students'; C.detail = await loadBundle(r.data.id); render(); return;
    }
    if (form.id === 'leadForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('lead-err');
      if (v('website')) return;
      const miss = !v('first') || !v('last') || !v('birth') || !v('phone') || !v('email');
      if (miss) { err.textContent = T('e_fill'); err.hidden = false; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) { err.textContent = T('e_email'); err.hidden = false; return; }
      if (v('phone').replace(/\D/g, '').length < 9) { err.textContent = T('e_phone'); err.hidden = false; return; }
      if (!f.get('consent')) { err.textContent = T('e_consent'); err.hidden = false; return; }
      const p = C.pubProgs[ui.applyIdx], btn = document.getElementById('lead-submit'); btn.disabled = true; btn.textContent = T('sending');
      const { error } = await sb.rpc('submit_lead', { p_first: v('first'), p_last: v('last'), p_birth: v('birth'), p_email: v('email'), p_phone: v('phone'), p_university: p.university_id, p_program: p.name + (p.thesis ? ' · ' + p.thesis : '') + (p.language ? ' (' + p.language + ')' : '') + (p.fee_usd ? ' — ' + usd(p.fee_usd) + (p.basis === 'total' ? ' ümumi' : '/il') : ''), p_degree: p.degree, p_message: (LANG !== 'az' ? '[Dil: ' + LANG.toUpperCase() + '] ' : '') + v('message'), p_consent_version: LEAD_VERSION, p_ua: navigator.userAgent });
      if (error) { err.textContent = (LANG === 'az' && error.message) || T('e_send'); err.hidden = false; btn.disabled = false; btn.textContent = T('send'); return; }
      ui.applyIdx = null; ui.leadDone = v('first') + ' ' + v('last') + ' · ' + p.name; render(); window.scrollTo(0, 0); return;
    }
    if (form.id === 'partnerForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('pt-err');
      if (v('website2')) return;
      const bad = m => { err.textContent = m; err.hidden = false; };
      if (!v('name') || !v('city') || !v('contact_name') || !v('phone') || !v('email')) return bad('Bütün * xanaları doldurun.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) return bad('E-poçt ünvanı düzgün deyil.');
      if (v('phone').replace(/\D/g, '').length < 9) return bad('Telefon nömrəsini tam yazın.');
      if (!f.get('consent')) return bad('Davam etmək üçün razılıq xanasını işarələyin.');
      const btn = document.getElementById('pt-submit'); btn.disabled = true; btn.textContent = 'Göndərilir…';
      const { error } = await sb.rpc('submit_agency_request', { p_name: v('name'), p_country: v('country'), p_city: v('city'), p_reg_no: v('reg_no'), p_website: v('website'), p_years: v('years'), p_contact_name: v('contact_name'), p_contact_title: v('contact_title'), p_phone: v('phone'), p_email: v('email'), p_volume: v('volume'), p_source: v('source'), p_directions: f.getAll('dir').map(String), p_message: v('message'), p_ua: navigator.userAgent });
      if (error) { bad(error.message || 'Göndərmək alınmadı, bir az sonra yenidən cəhd edin.'); btn.disabled = false; btn.textContent = 'Sorğunu göndər'; return; }
      ui.partnerDone = v('name'); render(); window.scrollTo(0, 0); return;
    }
    if (form.id === 'agStudentForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('ags-err');
      const bad = m => { err.textContent = m; err.hidden = false; };
      if (!v('first_name') || !v('last_name')) return bad('Ad və soyadı yazın.');
      const choices = [0, 1, 2].map(i => { const u = C.unis.find(x => x.id === v('uni' + i)); return u || v('prog' + i) ? { university_id: u ? u.id : null, university_name: u ? u.name : null, city: u ? u.city : null, program: v('prog' + i) || null, degree: v('deg' + i) || null } : null; }).filter(Boolean);
      if (!choices.length || !choices[0].university_id || !choices[0].program) return bad('1-ci seçim üçün universitet və ixtisası yazın.');
      const row = { first_name: v('first_name'), last_name: v('last_name'), birth_date: v('birth_date') || null, citizenship: v('citizenship') || null, phone: v('phone') || null, gpa: v('gpa') || null, choices, agent_note: v('agent_note') || null };
      const btn = document.getElementById('ags-submit'); btn.disabled = true;
      let id = form.dataset.id;
      if (id) await q(sb.from('agency_students').update(row).eq('id', id)).finally(() => { btn.disabled = false; });
      else { const r = await q(sb.from('agency_students').insert({ ...row, agency_id: C.agency.id, created_by: C.me.id }).select('id').single()).finally(() => { btn.disabled = false; }); id = r.id; }
      ui.agForm = null; ui.agOpen = id; await loadAgent(); render(); window.scrollTo(0, 0); return toast(form.dataset.id ? 'Yadda saxlanıldı' : 'Tələbə əlavə olundu — indi sənədləri yükləyin');
    }
    if (form.id === 'ambForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('na-err');
      if (!v('email') || !v('first_name') || !v('last_name') || !v('city')) { err.textContent = 'E-poçt, ad, soyad və şəhəri doldur.'; err.hidden = false; return; }
      const btn = document.getElementById('na-submit'); btn.disabled = true; btn.textContent = 'Yaradılır…';
      const body = { action: 'create_ambassador', email: v('email'), first_name: v('first_name'), last_name: v('last_name'), phone: v('phone') || null, city: v('city'), university_name: v('university_name') || null, program: v('program') || null, degree: v('degree') || null, study_year: +v('study_year') || null, since_year: +v('since_year') || null, languages: v('languages') || null, bio: v('bio') || null };
      const r = await sb.functions.invoke('create-student', { body });
      const msg = r.data && r.data.error ? r.data.error : r.error ? (await (async () => { try { const j = await r.error.context.json(); return j.error; } catch (x) { return r.error.message; } })()) : null;
      if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Səfiri yarat'; return; }
      ui.modal = null; ui.created = { title: body.first_name + ' ' + body.last_name + ' səfir kimi əlavə olundu', email: r.data.email, temp_password: r.data.temp_password, who: 'səfirə' };
      ui.ambOpen = r.data.id; await loadAmbAdmin(); render(); return;
    }
    if (form.id === 'uniForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim();
      const programs = v('programs').split(',').map(s => s.trim()).filter(Boolean);
      if (!v('name') || !v('city') || !programs.length) return toast('Bütün xanaları doldur');
      const row = await q(sb.from('universities').insert({ country: v('country'), name: v('name'), city: v('city'), type: v('type'), programs: [] }).select().single());
      await q(sb.from('university_programs').insert(programs.map(n => ({ university_id: row.id, degree: v('degree'), name: n, source: 'Diplomax tərəfindən əlavə edilib' }))));
      await loadUnis(); render(); return toast('Universitet əlavə olundu');
    }
  } catch (err) { console.error(err); }
});

async function boot() {
  try {
    await loadSettings();
    await loadMe();
    if (C.me && !C.me.access_active && !isStaff()) { await sb.auth.signOut(); C.me = null; render(); return toast('Portala girişiniz bağlanıb. Menecerinizlə əlaqə saxlayın.'); }
    if (C.me && isStaff()) { await Promise.all([loadStudents(), loadUnis(), loadLeads(), loadAgencyAdmin().catch(() => null)]); }
    else if (C.me && isAmb()) { await loadAmbInbox(); }
    else if (C.me && isAgent()) { await loadAgent(); }
    else if (C.me) { await loadMyConsent(); render(); if (consentOk(C.myConsent)) await reloadPortal(); }
    if (location.hash === '#partner') ui.partner = true;
    if (location.hash === '#katalog') { goPublic(); render(); await Promise.all([C.unis.length ? null : loadUnis(), loadPubProgs()]); }
    render();
  } catch (e) { console.error(e); app().innerHTML = '<div class="login"><div class="card"><h2>Bağlantı xətası</h2><p class="note">Səhifəni yeniləyin. Problem davam edərsə, Diplomax ilə əlaqə saxlayın.</p></div></div>'; }
}
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { ui.recovering = true; setTimeout(renderRecovery, 0); } });
if (/type=recovery/.test(location.hash)) { ui.recovering = true; renderRecovery(); }
else boot();
</script>
</body>
</html>
