const isStaff = () => C.me && ['admin', 'manager'].includes(C.me.role);

async function signedAvatar(path) {
  if (!path) return '';
  if (C.avatars[path]) return C.avatars[path];
  const { data } = await sb.storage.from('avatars').createSignedUrl(path, 3600);
  return (C.avatars[path] = data ? data.signedUrl : '');
}
async function preloadAvatars(paths) {
  const need = [...new Set(paths.filter(p => p && !C.avatars[p]))];
  if (!need.length) return;
  const { data } = await sb.storage.from('avatars').createSignedUrls(need, 3600);
  (data || []).forEach(x => { if (x.signedUrl) C.avatars[x.path] = x.signedUrl; });
}
const av = (p, s = 36) => `<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .36)}px">${p.avatar_path && C.avatars[p.avatar_path] ? `<img src="${C.avatars[p.avatar_path]}" alt="">` : esc(initials(p))}</span>`;

function applyBrand() {
  const s = C.settings, r = document.documentElement.style;
  r.setProperty('--brand', s.brand_color || '#1E3A6E');
  r.setProperty('--accent', s.accent_color || '#D99A2B');
  document.title = (s.company_name || 'Diplomax');
}
const logoHtml = (sz = 34) => { const s = C.settings; return `<span class="logo" style="width:${sz}px;height:${sz}px">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="Logo">` : esc((s.company_name || 'D')[0])}</span>`; };

async function loadSettings() { const d = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle(); C.settings = d.data || {}; applyBrand(); }
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { C.me = null; return; }
  C.me = await q(sb.from('profiles').select('*').eq('id', session.user.id).single());
  C.me.email = session.user.email;
}
async function loadStudents() {
  const [list, unread, reqs] = await Promise.all([
    q(sb.from('profiles').select('*, study_preferences(*), program_choices(*), applications(*), turkish_language(*), student_documents(id, original_received_at, translation, notary, apostille), profile_change_requests!profile_change_requests_student_id_fkey(id, resolved_at)').eq('role', 'student').order('created_at', { ascending: false })),
    q(sb.from('support_messages').select('student_id, sender_id').is('read_at', null)),
    q(sb.from('appointments').select('*').eq('status', 'requested'))
  ]);
  C.students = list;
  C.unread = {}; unread.forEach(m => { if (m.sender_id === m.student_id) C.unread[m.student_id] = (C.unread[m.student_id] || 0) + 1; });
  C.reqs = reqs;
  await preloadAvatars(list.map(s => s.avatar_path));
}
async function loadUnis() { C.unis = await q(sb.from('universities').select('*').order('country').order('name')); }
async function loadBundle(id) {
  const r = await Promise.all([
    sb.from('profiles').select('*').eq('id', id).single(),
    sb.from('study_preferences').select('*').eq('student_id', id).maybeSingle(),
    sb.from('program_choices').select('*').eq('student_id', id).order('rank'),
    sb.from('applications').select('*').eq('student_id', id).maybeSingle(),
    sb.from('stage_history').select('*').eq('student_id', id).order('changed_at'),
    sb.from('turkish_language').select('*').eq('student_id', id).maybeSingle(),
    sb.from('student_documents').select('*, document_types(name, returnable, sort_order)').eq('student_id', id),
    sb.from('document_files').select('*').eq('student_id', id).order('uploaded_at'),
    sb.from('support_messages').select('*').eq('student_id', id).order('created_at'),
    sb.from('appointments').select('*').eq('student_id', id).order('starts_at', { ascending: false }),
    sb.from('notifications').select('*').eq('user_id', id).order('created_at', { ascending: false }).limit(50),
    sb.from('group_members').select('*, groups(*)').eq('user_id', id),
    sb.from('profile_change_requests').select('*').eq('student_id', id).is('resolved_at', null)
  ]);
  const err = r.find(x => x.error); if (err) { toast('Xəta: ' + err.error.message); throw err.error; }
  const [p, pref, ch, app, hist, tk, docs, files, msgs, appts, notifs, gm, creq] = r.map(x => x.data);
  await preloadAvatars([p.avatar_path]);
  return { p, pref: pref || {}, choices: ch, app: app || { current_stage: 1 }, hist, tk: tk || { mode: 'self_study' }, docs: sortDocs(docs), files, msgs, appts, notifs, groups: gm, creq };
}
async function loadAdminGroups() {
  C.groups = await q(sb.from('groups').select('*, group_members(user_id, role, muted_until)').order('kind').order('name'));
  if (!ui.grp && C.groups[0]) ui.grp = C.groups[0].id;
  if (ui.grp) await loadGroupChat(ui.grp);
}
async function loadGroupChat(gid) {
  const [msgs, cards] = await Promise.all([
    q(sb.from('group_messages').select('*').eq('group_id', gid).is('deleted_at', null).order('created_at').limit(300)),
    q(sb.rpc('group_member_cards', { gid }))
  ]);
  C.gmsgs = msgs; C.gcards[gid] = cards;
  await preloadAvatars(cards.map(c => c.avatar_path));
}

function studentsList() {
  const L = C.students;

  const prog = L.reduce((n, s) => n + counts(s.student_documents).in_progress, 0);

  return `<div class="head"><div><h1>Tələbələr</h1><div class="sub">Müqavilə imzalamış tələbələr və onların prosesi</div></div><button class="btn acc" data-act="new">${ic('plus', 18)}Yeni tələbə</button></div>
  <div class="stats"><div class="stat"><span>Aktiv tələbə</span><b class="num">${L.length}</b></div>
    <div class="stat"><span>Sənədi çatışmayan</span><b class="num" style="color:var(--bad)">${missing}</b></div>
    <div class="stat"><span>Tərcümə / təsdiqdə sənəd</span><b class="num" style="color:var(--warn)">${prog}</b></div>
    <div class="stat"><span>Türk dili kursunda</span><b class="num">${tkc}</b></div></div>
  <label><span class="sr">Axtar</span><input id="q" class="inp" placeholder="Ad, kod, telefon və ya universitet üzrə axtar" autocomplete="off"></label>
  ${L.length ? `<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>TƏLƏBƏ</th><th>İSTİQAMƏT</th><th>MƏRHƏLƏ</th><th>SƏNƏDLƏR</th><th>TÜRK DİLİ</th><th>DİQQƏT</th></tr></thead><tbody>
  ${L.map(s => {
    const c = counts(s.student_documents), pr = s.study_preferences || {}, ch = (s.program_choices || []).sort((a, b) => a.rank - b.rank)[0];
    const stage = (s.applications && s.applications.current_stage) || 1, tk = (s.turkish_language && s.turkish_language.mode) || 'self_study';
    const flags = [];
    if (C.unread[s.id]) flags.push(pill('info', C.unread[s.id] + ' yeni mesaj'));
    if (C.reqs.some(a => a.student_id === s.id)) flags.push(pill('warn', 'Görüş sorğusu'));
    if (s.turkish_language && s.turkish_language.wants_to_join) flags.push(pill('warn', 'Kursa yazılmaq istəyir'));
    if ((s.profile_change_requests || []).some(r => !r.resolved_at)) flags.push(pill('warn', 'Düzəliş tələbi'));
    const hay = [s.first_name, s.last_name, s.student_code, s.phone, ch && ch.university_name, pr.country].join(' ').toLowerCase();
    return `<tr class="click" data-act="openst" data-id="${s.id}" data-hay="${esc(hay)}" tabindex="0">
      <td><div class="who">${av(s)}<span><b>${esc(fullName(s))}</b><small>${esc(s.student_code || '')}</small></span></div></td>
      <td>${pr.country ? esc(pr.country) + ' · ' + esc(DEGREES[pr.degree] || '—') : '<span class="note">Seçilməyib</span>'}<div class="note">${ch ? esc(ch.program_name + (ch.university_name ? ' · ' + ch.university_name : '')) : ''}</div></td>
      <td>${pill(stageKind(stage), stage + ' · ' + STAGE_SHORT[stage - 1])}</td>
      <td class="num"><b>${c.ready} / ${(s.student_documents || []).length}</b>${c.missing ? `<div style="color:var(--bad);font-size:12px;font-weight:700">${c.missing} çatışmır</div>` : ''}</td>
      <td>${esc(TK[tk])}</td><td><div class="chips">${flags.join('') || '<span class="note">—</span>'}</div></td></tr>`;
  }).join('')}</tbody></table></div>` : `<div class="empty">Hələ tələbə yoxdur. "Yeni tələbə" düyməsi ilə ilk tələbəni əlavə et.</div>`}`;
}

function readImage(file, max, cb) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(cb, 'image/jpeg', .85); }; img.onerror = () => toast('Şəkli oxumaq alınmadı'); img.src = r.result; };
  r.readAsDataURL(file);
}

  },
  tkadd: async () => { const tk = C.detail.tk; await q(sb.from('turkish_language').update({ mode: 'diplomax_course', wants_to_join: false, group_label: tk.group_label || 'Onlayn · A1' }).eq('student_id', ui.open)); await notify(ui.open, 'Türk dili kursuna əlavə olundun', 'Qrup: ' + (tk.group_label || 'Onlayn · A1')); await reloadDetail(); render(); toast('Kursa əlavə olundu'); },
  remind: async d => { const B = C.detail, doc = B.docs.find(x => x.id === d.doc), text = TEMPLATES[0][1].replace('{ad}', B.p.first_name).replace('{sənəd}', docName(doc)); await q(sb.from('support_messages').insert({ student_id: ui.open, sender_id: C.me.id, body: text })); await notify(ui.open, 'Çatışmayan sənəd', text); await reloadDetail(); render(); toast('Xatırlatma göndərildi'); },
  docadd: async () => { const v = document.getElementById('newDocName').value.trim(); if (!v) return toast('Sənədin adını yaz'); await q(sb.from('student_documents').insert({ student_id: ui.open, custom_name: v })); await reloadDetail(); render(); toast('Sənəd əlavə olundu'); },
  openfile: async d => { const { data, error } = await sb.storage.from('documents').createSignedUrl(d.path, 600); if (error) return toast('Faylı açmaq alınmadı'); const a = document.createElement('a'); a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); },
  tpl: d => { const B = C.detail, miss = B.docs.find(x => docStatus(x) === 'missing'); document.getElementById('amsg').value = TEMPLATES[+d.i][1].replace('{ad}', B.p.first_name).replace('{sənəd}', miss ? docName(miss) : 'sənəd'); },
  asend: async () => {
    const text = document.getElementById('amsg').value.trim(); if (!text) return toast('Mesaj boşdur');
    const ch = ['app', 'sms', 'whatsapp'].filter(k => document.getElementById('ch-' + k).checked);
    await q(sb.from('support_messages').insert({ student_id: ui.open, sender_id: C.me.id, body: text }));
    await q(sb.from('notifications').insert({ user_id: ui.open, title: (C.settings.company_name || 'Diplomax') + '-dan mesaj', body: text, channels: ch.length ? ch : ['app'], send_to_parent: document.getElementById('ch-parent').checked, sent_by: C.me.id }));
    await reloadDetail(); render(); scrollChat(); toast('Mesaj göndərildi');
  },
  appt: async d => { await q(sb.from('appointments').update({ status: d.v }).eq('id', d.id)); await notify(d.sid, d.v === 'confirmed' ? 'Görüşün təsdiqləndi' : 'Görüşün ləğv edildi', ''); await loadStudents(); await reloadDetail(); render(); toast(d.v === 'confirmed' ? 'Təsdiqləndi' : 'Ləğv edildi'); },
  gopen: async d => { ui.grp = d.id; await loadGroupChat(d.id); render(); scrollChat(); },
  gdel: async d => { await q(sb.from('group_messages').update({ deleted_at: new Date().toISOString(), deleted_by: C.me.id }).eq('id', d.id)); await loadGroupChat(ui.grp); render(); toast('Mesaj silindi'); },
  gmute: async d => { await q(sb.from('group_members').update({ muted_until: d.on === '1' ? null : new Date(Date.now() + 86400e3).toISOString() }).eq('group_id', ui.grp).eq('user_id', d.uid)); await loadAdminGroups(); render(); toast(d.on === '1' ? 'Susdurma götürüldü' : '24 saat susduruldu'); },
  gsend: async () => {
    const text = document.getElementById('gmsg').value.trim(); if (!text) return toast('Mesaj boşdur');
    const ann = document.getElementById('gann').checked;
    await q(sb.from('group_messages').insert({ group_id: ui.grp, sender_id: C.me.id, body: text, is_announcement: ann }));
    if (ann) { const g = C.groups.find(x => x.id === ui.grp); if (g.group_members.length) await q(sb.from('notifications').insert(g.group_members.map(m => ({ user_id: m.user_id, title: 'Qrupda yeni elan', body: text, sent_by: C.me.id })))); }
    await loadGroupChat(ui.grp); render(); scrollChat(); toast('Göndərildi');
  },
  unidel: async (d, el) => { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Əminsən? Bas'; return; } await q(sb.from('universities').delete().eq('id', d.id)); await loadUnis(); render(); toast('Silindi'); },
  logodel: async () => { await q(sb.from('app_settings').update({ logo_url: null }).eq('id', 1)); await loadSettings(); render(); },
  /* tələbə */
  stab: async d => { ui.stab = d.v; render(); if (d.v === 'group') { await reloadPortal(); render(); scrollChat(); } else if (d.v === 'notifs' && !ui.preview) { await q(sb.from('notifications').update({ read_at: new Date().toISOString() }).eq('user_id', C.me.id).is('read_at', null)); } else if (d.v === 'support') scrollChat(); window.scrollTo(0, d.v === 'support' ? document.body.scrollHeight : 0); },
  docf: d => { ui.docf = d.v; render(); },
  btype: d => { ui.book.type = d.v; render(); }, bday: d => { ui.book.day = d.v; ui.book.time = null; render(); }, btime: d => { ui.book.time = d.v; render(); },
  book: async () => { if (ui.preview) return toast('Önizləmədə görüş göndərilmir'); await q(sb.from('appointments').insert({ student_id: C.me.id, type: ui.book.type, starts_at: new Date(ui.book.day + 'T' + ui.book.time + ':00+04:00').toISOString() })); ui.book.time = null; await reloadPortal(); render(); toast('Görüş sorğun göndərildi'); },
  ssend: async () => { if (ui.preview) return toast('Önizləmədə mesaj göndərilmir'); const el = document.getElementById('smsg'), text = el.value.trim(); if (!text) return; await q(sb.from('support_messages').insert({ student_id: C.me.id, sender_id: C.me.id, body: text })); await reloadPortal(); render(); scrollChat(); const n = document.getElementById('smsg'); if (n) n.focus(); },
  req: async () => { if (ui.preview) return; const t = document.getElementById('reqTxt').value.trim(); if (!t) return toast('Nəyin səhv olduğunu yaz'); await q(sb.from('profile_change_requests').insert({ student_id: C.me.id, message: t })); await reloadPortal(); render(); toast('Sorğu göndərildi'); },
  tkjoin: async () => { await q(sb.rpc('request_turkish_course')); await reloadPortal(); render(); toast('Sorğun göndərildi'); },
  gtab: async d => { ui.gtab = d.v; await reloadPortal(); render(); scrollChat(); },
  gaccept: async d => { await q(sb.from('group_members').update({ rules_accepted_at: new Date().toISOString() }).eq('group_id', d.id).eq('user_id', C.me.id)); await reloadPortal(); render(); scrollChat(); toast('Qrupa qoşuldun'); },
  gpost: async d => { const el = document.getElementById('gpost'), text = el.value.trim(); if (!text) return; await q(sb.from('group_messages').insert({ group_id: d.id, sender_id: C.me.id, body: text })); await loadGroupChat(d.id); render(); scrollChat(); const n = document.getElementById('gpost'); if (n) n.focus(); }
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'scrim') e.preventDefault();
  if (ui.busy && el.dataset.act !== 'scrim') return;
  ui.busy = true;
  try { await fn(el.dataset, el, e); } catch (err) { console.error(err); } finally { ui.busy = false; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACT.openst(e.target.dataset);
  if (e.key === 'Enter' && e.target.id === 'smsg') ACT.ssend();
  if (e.key === 'Enter' && e.target.id === 'gpost') { const b = document.querySelector('[data-act="gpost"]'); if (b) ACT.gpost(b.dataset); }
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { const v = e.target.value.toLowerCase().trim(); document.querySelectorAll('tr[data-hay]').forEach(tr => tr.hidden = v && !tr.dataset.hay.includes(v)); }
  if (e.target.dataset.set === 'brand_color' || e.target.dataset.set === 'accent_color') { C.settings[e.target.dataset.set] = e.target.value; applyBrand(); }
});
function fillUniSelects() {
  const country = document.getElementById('nf-country').value, us = C.unis.filter(u => u.country === country);
  [0, 1, 2].forEach(i => { document.getElementById('nf-uni' + i).innerHTML = `<option value="">${country ? 'Seç' : 'Əvvəlcə ölkəni seç'}</option>` + us.map(u => `<option value="${u.id}">${esc(u.name)} · ${esc(u.city)}</option>`).join(''); document.getElementById('nf-prog' + i).innerHTML = '<option value="">—</option>'; });
}
document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset;
  try {
    if (t.id === 'nf-country') return fillUniSelects();
    if (ds.nfuni !== undefined) { const u = C.unis.find(x => x.id === t.value); document.getElementById('nf-prog' + ds.nfuni).innerHTML = u ? u.programs.map(p => `<option>${esc(p)}</option>`).join('') : '<option value="">—</option>'; return; }
    if (ds.set) { await q(sb.from('app_settings').update({ [ds.set]: t.value, updated_at: new Date().toISOString() }).eq('id', 1)); await loadSettings(); render(); return toast('Yadda saxlanıldı'); }
    if (t.id === 'logoInput') { const f = t.files[0]; if (!f) return; const path = 'logo-' + Date.now() + '-' + safeName(f.name); await q(sb.storage.from('branding').upload(path, f, { upsert: true, contentType: f.type })); const url = sb.storage.from('branding').getPublicUrl(path).data.publicUrl; await q(sb.from('app_settings').update({ logo_url: url }).eq('id', 1)); await loadSettings(); render(); return toast('Logo yeniləndi'); }
    if (ds.photo) { if (ui.preview) return toast('Önizləmədə şəkil dəyişmir'); return readImage(t.files[0], 400, async blob => { const path = ds.photo + '/avatar-' + Date.now() + '.jpg'; await q(sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' })); await q(sb.from('profiles').update({ avatar_path: path }).eq('id', ds.photo)); if (C.detail && C.detail.p.id === ds.photo) await reloadDetail(); if (C.bundle && C.bundle.p.id === ds.photo) await reloadPortal(); if (isStaff()) await loadStudents(); render(); toast('Şəkil yeniləndi'); }); }
    if (!C.detail) return;
    const B = C.detail;
    if (ds.pf) { const v = t.type === 'checkbox' ? t.checked : (t.value || null); await q(sb.from('profiles').update({ [ds.pf]: v }).eq('id', ui.open)); await reloadDetail(); if (ds.pf === 'first_name' || ds.pf === 'last_name' || ds.pf === 'access_active') render(); return toast('Yadda saxlanıldı'); }
    if (ds.sp) {
      const v = ds.sp === 'intake_year' ? (+t.value || null) : (t.value || null);
      const before = B.docs.length;
      await q(sb.from('study_preferences').update({ [ds.sp]: v }).eq('student_id', ui.open));
      await reloadDetail(); render();
      const added = C.detail.docs.length - before;
      return toast(added > 0 ? added + ' sənəd siyahıya avtomatik əlavə olundu' : 'Yadda saxlanıldı');
    }
    if (ds.ch) {
      const c = B.choices[+ds.i];
      if (ds.ch === 'uni') { const u = C.unis.find(x => x.name === t.value && x.country === B.pref.country); if (!u) return; await q(sb.from('program_choices').update({ university_name: u.name, city: u.city, program_name: u.programs[0] || c.program_name }).eq('id', c.id)); }
      else await q(sb.from('program_choices').update({ program_name: t.value }).eq('id', c.id));
      await reloadDetail(); render(); return toast('Yadda saxlanıldı');
    }
    if (ds.tk) { const patch = { [ds.tk]: t.value || null }; if (ds.tk === 'mode') patch.wants_to_join = false; await q(sb.from('turkish_language').update(patch).eq('student_id', ui.open)); await reloadDetail(); render(); return toast('Yadda saxlanıldı'); }
    if (ds.df) {
      const d = B.docs.find(x => x.id === ds.doc), was = docStatus(d), patch = { [ds.df]: t.value || null };
      if (['translation', 'notary', 'apostille'].includes(ds.df) && t.value === 'done' && !d[ds.df + '_done_at']) patch[ds.df + '_done_at'] = todayISO();
      if (ds.df === 'original_returned_at') patch.return_status = t.value ? 'returned' : 'in_office';
      if (ds.df === 'original_received_at') patch.return_status = t.value ? (docReturnable(d) ? 'in_office' : 'not_returnable') : 'not_received';
      const next = Object.assign({}, d, patch), is = docStatus(next); patch.status = is;
      await q(sb.from('student_documents').update(patch).eq('id', d.id));
      if (was !== 'ready' && is === 'ready') await notify(ui.open, 'Sənədin hazırdır', docName(d));
      else if (ds.df === 'original_received_at' && t.value && was === 'missing') await notify(ui.open, 'Sənədin qəbul edildi', docName(d) + ' · ' + fmt(t.value));
      await reloadDetail(); render(); return toast(is !== was ? 'Status: ' + DS[is][1] : 'Yadda saxlanıldı');
    }
    if (ds.docfile) {
      const f = t.files[0]; if (!f) return;
      if (f.size > 20 * 1024 * 1024) return toast('Fayl 20 MB-dan böyük olmamalıdır');
      toast('Yüklənir…');
      const path = ui.open + '/' + Date.now() + '-' + safeName(f.name);
      await q(sb.storage.from('documents').upload(path, f, { contentType: f.type || 'application/octet-stream' }));
      await q(sb.from('document_files').insert({ student_document_id: ds.docfile, student_id: ui.open, storage_path: path, file_name: f.name, mime_type: f.type, size_bytes: f.size, uploaded_by: C.me.id }));
      await notify(ui.open, 'Sənədin skanı yükləndi', docName(B.docs.find(x => x.id === ds.docfile)));
      await reloadDetail(); render(); return toast('Skan yükləndi');
    }
  } catch (err) { console.error(err); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  try {
    if (form.id === 'loginForm') {
      const err = document.getElementById('lg-err'); err.hidden = true;
      const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('lg-email').value.trim(), password: document.getElementById('lg-pass').value });
      if (error) { err.textContent = 'E-poçt və ya parol səhvdir.'; err.hidden = false; return; }
      await boot(); return;
    }
    if (form.id === 'pwForm') {
      const v = document.getElementById('newpw').value; if (v.length < 8) return toast('Parol ən azı 8 simvol olmalıdır');
      const { error } = await sb.auth.updateUser({ password: v }); if (error) return toast('Xəta: ' + error.message);
      form.reset(); return toast('Parol dəyişdirildi');
    }
    if (form.id === 'newForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('nf-err');
      if (!v('email') || !v('first_name') || !v('last_name')) { err.textContent = 'E-poçt, ad və soyadı doldur.'; err.hidden = false; return; }
      const choices = [0, 1, 2].map(i => { const u = C.unis.find(x => x.id === v('uni' + i)); return u ? { university_name: u.name, city: u.city, program_name: v('prog' + i) || u.programs[0] } : null; }).filter(Boolean);
      const btn = document.getElementById('nf-submit'); btn.disabled = true; btn.textContent = 'Yaradılır…';
      const body = { email: v('email'), first_name: v('first_name'), last_name: v('last_name'), father_name: v('father_name'), mother_name: v('mother_name'), birth_date: v('birth_date') || null, phone: v('phone'), parent_phone: v('parent_phone'), registration_address: v('registration_address'), contract_signed_at: v('contract_signed_at') || null, country: v('country') || null, degree: v('degree') || null, intake_year: +v('intake_year') || null, turkish_mode: v('turkish_mode'), choices };
      const r = await sb.functions.invoke('create-student', { body });
      const msg = r.data && r.data.error ? r.data.error : r.error ? (await (async () => { try { const j = await r.error.context.json(); return j.error; } catch (x) { return r.error.message; } })()) : null;
      if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Tələbəni yarat və giriş ver'; return; }
      ui.modal = null; ui.created = { title: body.first_name + ' ' + body.last_name + ' yaradıldı · ' + (r.data.student_code || ''), email: r.data.email, temp_password: r.data.temp_password };
      await loadStudents(); ui.open = r.data.id; ui.ctab = 'docs'; C.detail = await loadBundle(r.data.id); render(); return;
    }
    if (form.id === 'uniForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim();
      const programs = v('programs').split(',').map(s => s.trim()).filter(Boolean);
      if (!v('name') || !v('city') || !programs.length) return toast('Bütün xanaları doldur');
      await q(sb.from('universities').insert({ country: v('country'), name: v('name'), city: v('city'), programs }));
      await loadUnis(); render(); return toast('Universitet əlavə olundu');
    }
  } catch (err) { console.error(err); }
});

async function boot() {
  try {
    await loadSettings();
    await loadMe();
    if (C.me && !C.me.access_active && !isStaff()) { await sb.auth.signOut(); C.me = null; render(); return toast('Portala girişiniz bağlanıb. Menecerinizlə əlaqə saxlayın.'); }
    if (C.me && isStaff()) { await Promise.all([loadStudents(), loadUnis()]); }
    else if (C.me) { render(); await reloadPortal(); }
    render();
  } catch (e) { console.error(e); app().innerHTML = '<div class="login"><div class="card"><h2>Bağlantı xətası</h2><p class="note">Səhifəni yeniləyin. Problem davam edərsə, Diplomax ilə əlaqə saxlayın.</p></div></div>'; }
}
boot();
</script>
</body>
</html>
