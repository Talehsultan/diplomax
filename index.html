function catFilter(list, q) {
  const terms = norm(q.q || '').split(/\s+/).filter(Boolean), mn = +q.min || 0, mx = +q.max || 0, pop = q.pop ? (POP.find(x => x[0] === q.pop) || [])[2] : null;
  let out = list.filter(p => { const u = D.umap[p.university_id]; if (!u) return false; const nm = norm(p.name + ' ' + u.name + ' ' + u.city);
    return (!q.country || u.country === q.country) && (!q.city || u.city === q.city) && (!q.type || u.type === q.type) && (!q.uni || u.id === q.uni) && (!q.deg || p.degree === q.deg)
      && (!q.lang || (q.lang === 'en' ? isEn(p.language) : isTr(p.language))) && (!q.area || areaMatch(q.area, p.name)) && (!pop || pop(norm(p.name))) && terms.every(t => termOk(t, nm, norm(p.name)))
      && ((!mn && !mx) || (p.fee_usd && (!mn || +p.fee_usd >= mn) && (!mx || +p.fee_usd <= mx))); });
  const dir = q.sort === 'desc' ? -1 : 1;
  out.sort((a, b) => (a.fee_usd == null) - (b.fee_usd == null) || (q.sort ? dir * ((+a.fee_usd || 0) - (+b.fee_usd || 0)) : 0));
  return out;
}

/* --- Kalkulyator --- */
const LIVE = { ist: 1000, ank: 700, ant: 750, oth: 550, cy: 750 };
function pCalc() {
  const c = R.calc || (R.calc = { fee: 3000, sch: 0, years: 4, prep: false, city: 'ist', live: LIVE.ist, months: 10, extra: 600, ref: '' });
  const tu = c.fee * (1 - c.sch / 100) * c.years + (c.prep ? c.fee * (1 - c.sch / 100) : 0), yrs = c.years + (c.prep ? 1 : 0);
  const li = c.live * c.months * yrs, ex = c.extra * yrs, tot = tu + li + ex, y1 = c.fee * (1 - c.sch / 100) + c.live * c.months + c.extra;
  const opts = D.intl.filter(p => p.fee_usd && p.basis !== 'total' && p.degree === 'bachelor').slice().sort((a, b) => +a.fee_usd - +b.fee_usd);
  const num = (k, v, extra = '') => `<input class="inp" type="number" min="0" data-c="${k}" value="${v}" ${extra}>`;
  return phead(L('calc_t'), L('calc_s')) + `<div class="wrap" style="padding-top:28px"><div class="calc"><div class="card" style="display:flex;flex-direction:column;gap:14px">
    <label class="fld">${L('c_pick')}<select class="inp" data-c="ref"><option value="">${L('c_pick_ph')}</option>${opts.map(p => `<option value="${p.id}" ${c.ref === p.id ? 'selected' : ''}>${esc(p.name)} — ${esc((D.umap[p.university_id] || {}).name || '')} — ${usd(p.fee_usd)}</option>`).join('')}</select></label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><label class="fld">${L('c_fee')}${num('fee', c.fee, 'step="100"')}</label><label class="fld">${L('c_sch')}${num('sch', c.sch, 'max="100" step="5"')}</label><label class="fld">${L('c_years')}${num('years', c.years, 'max="7"')}</label></div>
    <label class="chk" style="font-size:15px;color:var(--fg);font-weight:600"><input type="checkbox" data-c="prep" ${c.prep ? 'checked' : ''}>${L('c_prep')}</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><label class="fld">${L('c_city')}<select class="inp" data-c="city">${Object.keys(LIVE).map(k => `<option value="${k}" ${c.city === k ? 'selected' : ''}>${L('cityc')[k]} (~${usd(LIVE[k])})</option>`).join('')}</select></label><label class="fld">${L('c_live')}${num('live', c.live, 'step="50"')}</label><label class="fld">${L('c_months')}${num('months', c.months, 'max="12"')}</label></div>
    <label class="fld">${L('c_extra')}${num('extra', c.extra, 'step="50"')}</label><p class="mut small" style="margin:0">${L('c_note')}</p></div>
    <div class="total"><span style="font-weight:700">${L('c_total')}</span><span class="big">${usd(tot)}</span><div class="row"><span>${L('c_y1')}</span><b>${usd(y1)}</b></div><div class="row"><span>${L('c_tu')}</span><b>${usd(tu)}</b></div><div class="row"><span>${L('c_li')}</span><b>${usd(li)}</b></div><div class="row"><span>${L('c_ex')}</span><b>${usd(ex)}</b></div><button class="btn acc" data-a="apply" style="margin-top:8px">${L('c_cta')}</button></div></div></div>`;
}

/* --- Uyğunluq testi --- */
function pTest() {
  const t = R.test, Q = [
    ['area', L('q1'), AREAS.map(a => [a[0], L('a_' + a[0])])],
    ['deg', L('q2'), ['bachelor', 'associate', 'master', 'doctorate'].map(k => [k, L(k)])],

    ['country', L('q5'), [...new Set(D.unis.map(u => u.country))].map(c => [c, ctry(c)]).concat([['', L('any_l')]])]

/* ============ Hadisələr ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'mclose') { if (el.classList.contains('scrim') && e.target !== el) return; e.preventDefault(); closeModal(); return; }
  if (a === 'lang') { LANG = el.dataset.v; try { localStorage.setItem('dx_lang', LANG); } catch (x) {} renderAll(); return; }
  if (a === 'menu') { R.menu = !R.menu; renderChrome(); return; }
  if (a === 'regi') { const b = document.querySelector('#regi [data-rg="open"]'); if (b) b.click(); return; }
  if (a === 'howplay') { const b = document.getElementById('howbox'), sec = document.getElementById('howsec'); if (!b) return; if (el.classList.contains('vlink')) sec.scrollIntoView({ behavior: 'smooth', block: 'center' }); DEMO.start(b); return; }
  if (a === 'demostop') { DEMO.stop(); return; }

  if (a === 'more') { R.n += 40; const y = window.scrollY; renderView(); window.scrollTo(0, y); return; }
  if (a === 'reset') { go(el.dataset.v); return; }
  if (a === 'cmp') { let l = cmpList(); const r = el.dataset.ref; l = l.includes(r) ? l.filter(x => x !== r) : l.concat(r).slice(-3); cmpSave(l); const y = window.scrollY; renderView(); window.scrollTo(0, y); return; }
  if (a === 'tans') { R.test.a[el.dataset.k] = el.dataset.v; if (R.test.step < 4) R.test.step++; renderView(); return; }
  if (a === 'tback') { R.test.step = Math.max(0, R.test.step - 1); renderView(); return; }
  if (a === 'tgo') { const t = R.test.a, [mn, mx] = (t.b || '').split('-'); R.test = { step: 0, a: {} }; go('ixtisaslar', { area: t.area, deg: t.deg, lang: t.lang, country: t.country, min: mn && +mn ? mn : '', max: mx || '', sort: 'asc' }); return; }
});
document.addEventListener('change', e => {

document.addEventListener('submit', async e => {

    ru: { ey: 'ИНСТРУКЦИЯ · 40 СЕКУНД', t: 'Выбери университет<br><em>за 40 секунд</em>', s: 'Турция и Северный Кипр — цены в долларах, заявка в один клик', st: ['Ищи', 'Фильтруй', 'Смотри вуз', 'Сравнивай', 'Подавай'], c: [['Введи специальность или вуз', ''], ['Фильтруй и сравнивай цены', 'всё в долларах'], ['Страница вуза: все программы и условия', ''], ['Добавь понравившиеся в сравнение', ''], ['Заявка в один клик', 'консультант свяжется с тобой']], q: 'psikoloji', oe: 'БЕСПЛАТНАЯ КОНСУЛЬТАЦИЯ', ot: 'Ты выбираешь —<br><em>остальное сделаем мы</em>', os: 'Документы, письмо о зачислении, виза и жильё — мы рядом на каждом шаге', b1: 'Получить консультацию', b2: 'Смотреть снова', nm: ['Aysel', 'Mamedova'] }
  };
  const CUR = '<svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2.5l15.5 9.2-6.9 1.6 3.9 7.1-3 1.6-3.9-7.2-5.2 4.9z" fill="#fff" stroke="#1d1240" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const VW = 1440, VH = 810, TOTAL = 40000;
  let run = 0, st = null;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const STOP = {};
  const chk = tok => { if (tok !== run) throw STOP; };
  const sleep = (ms, tok) => new Promise((res, rej) => setTimeout(() => tok !== run ? rej(STOP) : res(), ms));
  const tween = (ms, fn, tok) => new Promise((res, rej) => { const t0 = performance.now(); const step = now => { if (tok !== run) return rej(STOP); const k = Math.min(1, (now - t0) / ms); fn(ease(k)); k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });

  function stop() {
    run++;
    if (st) { try { localStorage.setItem('dx_cmp', st.cmp == null ? '[]' : st.cmp); if (st.cmp == null) localStorage.removeItem('dx_cmp'); } catch (e) {} st.box.classList.remove('on'); st.stage.remove(); st = null; }
  }

  async function start(box) {
    stop(); const tok = run; const X = TX[LANG] || TX.az;
    let cmp = null; try { cmp = localStorage.getItem('dx_cmp'); } catch (e) {}
    box.classList.add('on');
    const stage = document.createElement('div'); stage.className = 'dstage';
    stage.innerHTML = `<iframe title="Diplomax demo" tabindex="-1" aria-hidden="true" scrolling="no"></iframe><div class="dov"><div class="dhl"></div><div class="dcap"></div><div class="drip"></div><div class="dcur">${CUR}</div></div><div class="dcard"></div><button type="button" class="dstop" data-a="demostop" aria-label="Bağla">✕</button><div class="dbar"></div>`;
    box.appendChild(stage); st = { box, stage, cmp };
    const fr = stage.querySelector('iframe'), ov = stage.querySelector('.dov'), card = stage.querySelector('.dcard'), cap = stage.querySelector('.dcap'), cur = stage.querySelector('.dcur'), rip = stage.querySelector('.drip'), hl = stage.querySelector('.dhl'), bar = stage.querySelector('.dbar');
    const fit = () => { const k = box.clientWidth / VW; fr.style.transform = ov.style.transform = `scale(${k})`; };
    fit(); window.addEventListener('resize', fit);
    const t0 = performance.now(); const tick = () => { if (tok !== run) return; bar.style.width = Math.min(100, (performance.now() - t0) / TOTAL * 100) + '%'; requestAnimationFrame(tick); }; tick();
    let cx = 1300, cy = 560; const place = () => { cur.style.transform = `translate(${cx}px,${cy}px)`; }; place(); cur.style.opacity = 0;
    const W = () => fr.contentWindow, d = () => fr.contentDocument;
    const $ = (s, root) => (root || d()).querySelector(s);
    const rect = el => el.getBoundingClientRect();
    const move = async (el, ms = 800, dx = 0) => { const r = rect(el), x1 = r.left + r.width / 2 + dx, y1 = r.top + r.height / 2, x0 = cx, y0 = cy; cur.style.opacity = 1; await tween(ms, k => { cx = x0 + (x1 - x0) * k; cy = y0 + (y1 - y0) * k; place(); }, tok); };
    const click = async fn => { rip.style.opacity = 1; await tween(260, k => { const r = 8 + k * 30; Object.assign(rip.style, { left: cx - r + 'px', top: cy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: 1 - k }); }, tok); if (fn) fn(); };
    const caption = (n, a, b) => { cap.classList.remove('on'); setTimeout(() => { cap.innerHTML = `<i>${n}</i><span>${a}${b ? ` <small>${b}</small>` : ''}</span>`; cap.classList.add('on'); }, n === 1 ? 0 : 200); };
    const scroll = (dy, ms) => { const y0 = W().scrollY; return tween(ms, k => W().scrollTo(0, y0 + dy * k), tok); };
    const type = async (el, text, ms) => { el.focus(); for (let i = 1; i <= text.length; i++) { el.value = text.slice(0, i); el.dispatchEvent(new Event('input', { bubbles: true })); await sleep(ms / text.length, tok); } };
    const setSel = (el, v) => { el.value = v; el.dispatchEvent(new Event('change', { bubbles: true })); el.dispatchEvent(new Event('input', { bubbles: true })); };
    const hlOn = el => { const r = rect(el); Object.assign(hl.style, { left: r.left - 12 + 'px', top: r.top - 10 + 'px', width: r.width + 24 + 'px', height: r.height + 20 + 'px', opacity: 1 }); };
    const hlOff = () => { hl.style.opacity = 0; };
    const waitFor = async (fn, ms = 6000) => { const t = performance.now(); while (performance.now() - t < ms) { const v = fn(); if (v) return v; await sleep(80, tok); } return null; };
    const showCard = html => { card.innerHTML = html; card.classList.add('on'); };

    try {
      try { localStorage.removeItem('dx_cmp'); } catch (e) {}
      showCard(`<small>${X.ey}</small><h3>${X.t}</h3><p>${X.s}</p><div class="dst">${X.st.map((s, i) => `<span>${i + 1} · ${s}</span>`).join('')}</div>`);
      fr.src = location.pathname + '?demo=1#/';
      await sleep(3200, tok);
      const inp = await waitFor(() => fr.contentDocument && $('#hsearch input[name=q]'), 9000);
      if (!inp) throw new Error('demo: site not ready');
      card.classList.remove('on'); await sleep(350, tok);

      // 1 — axtar
      caption(1, ...X.c[0]); await sleep(500, tok);
      await move(inp, 900, -120); await click(); await type(inp, X.q, 1200); await sleep(300, tok);
      const sb = $('#hsearch button.btn.acc'); await move(sb, 700); await click(() => sb.click());
      await sleep(900, tok);

      // 2 — filtrlə
      caption(2, ...X.c[1]);
      const city = await waitFor(() => $('select[name=city]'));
      if (city) { await move(city, 800); await click(() => { const o = [...city.options].find(o => /^İstanbul$|^Istanbul$/.test(o.textContent.trim())); if (o) setSel(city, o.value); }); await sleep(900, tok); }
      const sort = await waitFor(() => $('select[name=sort]'));
      if (sort) { const r = rect(sort); if (r.top > VH - 160) await scroll(r.top - 480, 700); await move(sort, 700); await click(() => setSel($('select[name=sort]') || sort, 'asc')); await sleep(600, tok); }
      await scroll(-W().scrollY, 600);
      const fee = $('.pcard .fee'); if (fee) { await move(fee, 600, -20); hlOn(fee); await sleep(1100, tok); hlOff(); }
      await scroll(520, 1300);

      // 3 — universitet
      caption(3, ...X.c[2]);
      const ul = [...d().querySelectorAll('.pcard a.un')].find(a => /Işık/.test(a.textContent)) || $('.pcard a.un');
      if (ul) { ul.scrollIntoView({ block: 'center' }); await sleep(200, tok); await move(ul, 700); await click(() => ul.click()); await sleep(900, tok); W().scrollTo(0, 0); }
      await sleep(400, tok);
      const hc = $('.hlcard'); if (hc) { await scroll(Math.max(0, rect(hc).top - 110), 800); await move(hc, 600, rect(hc).width / 2 - 140); hlOn(hc); await sleep(1500, tok); hlOff(); }

      // 4 — müqayisə
      caption(4, ...X.c[3]);
      await scroll(520, 900);
      for (let i = 0; i < 2; i++) { const bs = [...d().querySelectorAll('button[data-a="cmp"]')].filter(b => rect(b).top > 80 && rect(b).bottom < VH - 40); const b = bs[i] || bs[0]; if (b) { await move(b, 600); await click(() => b.click()); await sleep(250, tok); } }
      await scroll(-W().scrollY, 600);
      const nav = [...d().querySelectorAll('a[href="#/muqayise"]')].find(a => rect(a).width > 0 && rect(a).top < 100);
      if (nav) { await move(nav, 700); await click(() => nav.click()); }
      await sleep(1300, tok);

      // 5 — müraciət
      caption(5, ...X.c[4]);
      const ap = await waitFor(() => [...d().querySelectorAll('main button[data-a="apply"], #view button[data-a="apply"], .cmp button[data-a="apply"]')].find(b => b.offsetParent) || [...d().querySelectorAll('button[data-a="apply"]')].find(b => b.offsetParent && !b.closest('.tool')));
      if (ap) { ap.scrollIntoView({ block: 'center' }); await sleep(200, tok); await move(ap, 700); await click(() => ap.click()); await sleep(600, tok); }
      const ins = [...d().querySelectorAll('.scrim input, dialog input, [role=dialog] input')].filter(i => i.offsetParent && !/checkbox|hidden|date/.test(i.type));
      if (ins[0]) { await move(ins[0], 600, -80); await click(); await type(ins[0], X.nm[0], 600); }
      if (ins[1]) { await move(ins[1], 500, -60); await click(); await type(ins[1], X.nm[1], 800); }
      await sleep(1100, tok);

      // son
      cap.classList.remove('on'); cur.style.opacity = 0;
      showCard(`<small>${X.oe}</small><h3>${X.ot}</h3><p>${X.os}</p><div class="dbt"><button type="button" class="btn acc" data-a="apply">${X.b1}</button><button type="button" class="btn ghost" style="background:#fff" data-a="howplay">${X.b2}</button></div>`);
      try { if (st && st.cmp != null) localStorage.setItem('dx_cmp', st.cmp); else localStorage.removeItem('dx_cmp'); } catch (e) {}
      fr.src = 'about:blank'; bar.style.width = '100%'; run++;
    } catch (e) { if (e !== STOP) { console.warn(e); stop(); } }
  }
  return { start, stop };
})();
</script>
</body>
</html>
