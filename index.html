async function signedAvatar(path) {
  if (!path) return '';
  if (C.avatars[path]) return C.avatars[path];
  const { data } = await sb.storage.from('avatars').createSignedUrl(path, 3600);
  return (C.avatars[path] = data ? data.signedUrl : '');
}
async function preloadAvatars(paths) {
  const need = [...new Set(paths.filter(p => p && !C.avatars[p]))];
  if (!need.length) return;
  const { data } = await sb.storage.from('avatars').createSignedUrls(need, 3600);
  (data || []).forEach(x => { if (x.signedUrl) C.avatars[x.path] = x.signedUrl; });
}

const app = () => document.getElementById('app');
function render() {
  if (ui.recovering) return renderRecovery();
  if (!C.me) return renderLogin();
  if (isStaff() && !ui.preview) return renderAdmin();
  if (isAmb()) return renderAmbassador();
  if (!isStaff() && ui.consentDone) return renderConsentDone();
  if (!isStaff() && !consentOk(C.myConsent)) return renderConsent();
  return renderPortal();
}
function topbar(extra) {
  return `<header class="top"><div class="brandmark">${logoHtml()}<span>${esc(C.settings.company_name || 'DIPLOMAX')}<br><span class="tag">${isStaff() ? 'İDARƏETMƏ PANELİ' : isAmb() ? 'SƏFİR PANELİ' : 'TƏLƏBƏ PORTALI'}</span></span></div>${extra || ''}<button class="topbtn" data-act="logout">Çıxış</button></header>`;
}

function renderLogin() {
  app().innerHTML = `<div class="login"><form class="card" id="loginForm">
    <div class="row">${logoHtml(44)}<div><h2 style="font-size:20px">${esc(C.settings.company_name || 'Diplomax')}</h2><span class="note">Tələbə portalı və idarəetmə paneli</span></div></div>
    <label class="f">E-poçt<input class="inp" type="email" id="lg-email" autocomplete="username" required></label>
    <label class="f">Parol<input class="inp" type="password" id="lg-pass" autocomplete="current-password" required></label>
    <p class="note" id="lg-err" style="color:var(--bad);font-weight:700" hidden></p>
    <button class="btn" type="submit">Daxil ol</button>
    <button class="btn ghost" type="button" data-act="forgot">Parolu unutdum</button>
    <p class="note">Giriş məlumatlarını sizə Diplomax menecerləri verir. Parolu unutmusunuzsa, e-poçtunuzu yazıb "Parolu unutdum" düyməsinə basın — yeni parol üçün link göndəriləcək.</p>
    <a href="${PRIVACY_URL}" target="_blank" rel="noopener" class="note" style="font-weight:700;color:var(--link)">Məxfilik siyasəti</a>
  </form></div>`;
}
function renderRecovery() {
  app().innerHTML = `<div class="login"><form class="card" id="recoverForm">
    <div class="row">${logoHtml(44)}<div><h2 style="font-size:20px">Yeni parol</h2><span class="note">Hesabınız üçün yeni parol təyin edin</span></div></div>
    <label class="f">Yeni parol (ən azı 8 simvol)<input class="inp" type="password" id="rc-pass" autocomplete="new-password" minlength="8" required></label>
    <label class="f">Təkrar<input class="inp" type="password" id="rc-pass2" autocomplete="new-password" minlength="8" required></label>
    <p class="note" id="rc-err" style="color:var(--bad);font-weight:700" hidden></p>
    <button class="btn" type="submit">Parolu saxla və daxil ol</button>
  </form></div>`;
}

/* ============ ADMIN ============ */
function renderAdmin() {
  const reqN = C.reqs.length, unreadN = Object.values(C.unread).reduce((a, b) => a + b, 0);
  const nav = [['students', 'users', 'Tələbələr', unreadN], ['appts', 'cal', 'Görüşlər', reqN], ['groups', 'chat', 'Qruplar', 0], ['unis', 'cap', 'Universitetlər', 0], ['ambs', 'star', 'Səfirlər', (C.areports || []).length], ['consents', 'shield', 'Razılıqlar', 0], ['settings', 'gear', 'Parametrlər', 0]];
  let body;
  if (ui.atab === 'students') body = ui.open && C.detail ? studentCard(C.detail) : studentsList();
  else if (ui.atab === 'appts') body = apptsView();
  else if (ui.atab === 'groups') body = adminGroups();
  else if (ui.atab === 'unis') body = unisView();
  else if (ui.atab === 'consents') body = consentsView();
  else if (ui.atab === 'ambs') body = ambsView();
  else body = settingsView();
  app().innerHTML = topbar(`<button class="topbtn" data-act="refresh" aria-label="Yenilə">${ic('refresh', 16)}</button>`) +
    `<div class="admin"><nav class="side" aria-label="Menyu">${nav.map(([k, i, t, c]) => `<button data-act="atab" data-v="${k}" ${ui.atab === k ? 'aria-current="page"' : ''}>${ic(i, 18)}${t}${c ? `<span class="count">${c}</span>` : ''}</button>`).join('')}</nav><main class="work">${body}</main></div>` +
    (ui.modal === 'new' ? newStudentModal() : '') + (ui.modal === 'newamb' ? newAmbModal() : '') + (ui.created ? createdModal() : '');
}

function studentsList() {
  const L = C.students;
  const missing = L.filter(s => counts(s.student_documents).missing > 0).length;
  const prog = L.reduce((n, s) => n + counts(s.student_documents).in_progress, 0);
  const tkc = L.filter(s => s.turkish_language && s.turkish_language.mode === 'diplomax_course').length;
  const stageOf = s => (s.applications && s.applications.current_stage) || 1;
  const byStage = STAGES.map((_, i) => L.filter(s => stageOf(s) === i + 1).length);
  const dt = new Date(), today = ['Bazar', 'Bazar ertəsi', 'Çərşənbə axşamı', 'Çərşənbə', 'Cümə axşamı', 'Cümə', 'Şənbə'][dt.getDay()] + ', ' + dt.getDate() + ' ' + ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avqust', 'sentyabr', 'oktyabr', 'noyabr', 'dekabr'][dt.getMonth()];
  return `<div class="head"><div><span class="greet">${esc(today)}</span><h1>${greetWord()}${C.me.first_name ? ', ' + esc(C.me.first_name) : ''}</h1></div><button class="btn acc" data-act="new">${ic('plus', 18)}Yeni tələbə</button></div>
  <div class="stats"><div class="stat"><span>Aktiv tələbə</span><b class="num">${L.length}</b></div>
    <div class="stat"><span>Sənədi çatışmayan</span><b class="num" style="color:var(--bad)">${missing}</b></div>
    <div class="stat"><span>Tərcümə / təsdiqdə sənəd</span><b class="num" style="color:var(--warn)">${prog}</b></div>
    <div class="stat"><span>Türk dili kursunda</span><b class="num">${tkc}</b></div></div>
  <div class="card" style="gap:12px"><div class="sec-h"><b>Qəbul axını</b><span class="note">Mərhələyə bas, həmin tələbələr süzülsün</span></div>
    <div class="pipe">${STAGE_SHORT.map((t, i) => `<button data-act="stagef" data-v="${i + 1}" aria-pressed="${ui.stageF === i + 1}"><span>${i + 1} · ${t}</span><b class="num">${byStage[i]}</b></button>`).join('')}</div></div>
  <label><span class="sr">Axtar</span><input id="q" class="inp" placeholder="Ad, kod, telefon və ya universitet üzrə axtar" autocomplete="off"></label>
  ${ui.stageF ? `<div class="banner" style="background:var(--brand-soft);color:var(--brand)"><span>${ui.stageF} · ${STAGES[ui.stageF - 1]} mərhələsindəki tələbələr</span><button class="btn sm ghost" data-act="stagef" data-v="0">Hamısını göstər</button></div>` : ''}
  ${L.length ? `<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>TƏLƏBƏ</th><th>İSTİQAMƏT</th><th>MƏRHƏLƏ</th><th>SƏNƏDLƏR</th><th>TÜRK DİLİ</th><th>DİQQƏT</th></tr></thead><tbody>
  ${L.filter(s => !ui.stageF || stageOf(s) === ui.stageF).map(s => {
    const c = counts(s.student_documents), pr = s.study_preferences || {}, ch = (s.program_choices || []).sort((a, b) => a.rank - b.rank)[0];
    const stage = (s.applications && s.applications.current_stage) || 1, tk = (s.turkish_language && s.turkish_language.mode) || 'self_study';
    const flags = [];
    if (C.unread[s.id]) flags.push(pill('info', C.unread[s.id] + ' yeni mesaj'));
    if (C.reqs.some(a => a.student_id === s.id)) flags.push(pill('warn', 'Görüş sorğusu'));
    if (s.turkish_language && s.turkish_language.wants_to_join) flags.push(pill('warn', 'Kursa yazılmaq istəyir'));
    if ((s.profile_change_requests || []).some(r => !r.resolved_at)) flags.push(pill('warn', 'Düzəliş tələbi'));
    const hay = [s.first_name, s.last_name, s.student_code, s.phone, ch && ch.university_name, pr.country].join(' ').toLowerCase();
    return `<tr class="click" data-act="openst" data-id="${s.id}" data-hay="${esc(hay)}" tabindex="0">
      <td><div class="who">${av(s)}<span><b>${esc(fullName(s))}</b><small>${esc(s.student_code || '')}</small></span></div></td>
      <td>${pr.country ? esc(pr.country) + ' · ' + esc(DEGREES[pr.degree] || '—') : '<span class="note">Seçilməyib</span>'}<div class="note">${ch ? esc(ch.program_name + (ch.university_name ? ' · ' + ch.university_name : '')) : ''}</div></td>
      <td>${pill(stageKind(stage), stage + ' · ' + STAGE_SHORT[stage - 1])}</td>
      <td class="num"><b>${c.ready} / ${(s.student_documents || []).length}</b>${c.missing ? `<div style="color:var(--bad);font-size:12px;font-weight:700">${c.missing} çatışmır</div>` : ''}</td>
      <td>${esc(TK[tk])}</td><td><div class="chips">${flags.join('') || '<span class="note">—</span>'}</div></td></tr>`;
  }).join('')}</tbody></table></div>` : `<div class="empty">Hələ tələbə yoxdur. "Yeni tələbə" düyməsi ilə ilk tələbəni əlavə et.</div>`}`;
}

  return `<div class="scrim" data-act="scrim"><form class="modal" id="newForm" novalidate>
    <div class="row" style="justify-content:space-between"><h2 style="font-size:20px;font-weight:800">Yeni tələbə</h2><button type="button" class="btn ghost sm" data-act="closemodal">Bağla</button></div>
    <h3>Giriş və şəxsi məlumatlar</h3>
    <div class="grid3">
      <label class="f">E-poçt (giriş üçün) *<input class="inp" type="email" name="email" id="nf-email" required></label>
      <label class="f">Ad *<input class="inp" name="first_name" id="nf-first" required></label>
      <label class="f">Soyad *<input class="inp" name="last_name" id="nf-last" required></label>
      <label class="f">Ata adı<input class="inp" name="father_name" id="nf-father"></label>
      <label class="f">Ana adı<input class="inp" name="mother_name" id="nf-mother"></label>
      <label class="f">Doğum tarixi<input class="inp" type="date" name="birth_date" id="nf-birth"></label>
      <label class="f">Əlaqə nömrəsi<input class="inp" name="phone" id="nf-phone" placeholder="+994"></label>
      <label class="f">Valideyn nömrəsi<input class="inp" name="parent_phone" id="nf-pp"></label>
      <label class="f">Müqavilə tarixi<input class="inp" type="date" name="contract_signed_at" id="nf-contract" value="${todayISO()}"></label>
    </div>
    <label class="f">Qeydiyyat ünvanı<input class="inp" name="registration_address" id="nf-address"></label>
    <h3>Təhsil tərcihi</h3>
    <div class="grid3">
      <label class="f">Ölkə<select class="inp" name="country" id="nf-country"><option value="">Seç</option>${o(COUNTRIES.map(c => [c, c]), '')}</select></label>
      <label class="f">Universitet növü<select class="inp" id="nf-utype"><option value="">Hamısı</option><option value="state">Dövlət</option><option value="private">Özəl</option></select></label>
      <label class="f">Təhsil dərəcəsi<select class="inp" name="degree" id="nf-degree"><option value="">Seç</option>${o(Object.entries(DEGREES), '')}</select></label>
      <label class="f">Qəbul ili<input class="inp" type="number" name="intake_year" id="nf-year" value="${new Date().getFullYear()}"></label>
      <label class="f">Türk dili<select class="inp" name="turkish_mode" id="nf-tk">${o(Object.entries(TK), 'self_study')}</select></label>
    </div>
    <div class="grid2">${[0, 1, 2].map(i => `<div class="card" style="padding:12px;gap:8px"><span class="lbl">${i + 1}-ci tərcih</span>
      <label class="f">Universitet<select class="inp" name="uni${i}" id="nf-uni${i}" data-nfuni="${i}"><option value="">Əvvəlcə ölkəni seç</option></select></label>
      <label class="f">İxtisas<select class="inp" name="prog${i}" id="nf-prog${i}"><option value="">—</option></select></label></div>`).join('')}</div>
    <p class="note" id="nf-err" style="color:var(--bad);font-weight:700" hidden></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="closemodal">Ləğv et</button><button class="btn" type="submit" id="nf-submit">Tələbəni yarat və giriş ver</button></div>
  </form></div>`;
}
function createdModal() {
  const c = ui.created;
  return `<div class="scrim"><div class="modal" role="dialog" aria-label="Giriş məlumatları">
    <div class="banner ok"><span>${esc(c.title)}</span></div>
    <p style="margin:0">Bu məlumatları ${esc(c.who || 'tələbəyə')} göndər (məsələn WhatsApp ilə). Parol yalnız indi görünür.</p>
    <div class="grid2"><label class="f">Portal ünvanı<div class="code" style="font-size:13px">${esc(location.origin + location.pathname)}</div></label><label class="f">E-poçt<div class="code" style="font-size:14px">${esc(c.email)}</div></label></div>
    <label class="f">Müvəqqəti parol<div class="code">${esc(c.temp_password)}</div></label>
    <div class="row"><button class="btn acc" data-act="copycreds">Hamısını kopyala</button><button class="btn ghost" data-act="closecreated">Bağla</button></div>

function studentCard(B) {
  const p = B.p, c = counts(B.docs), stage = B.app.current_stage;
  const tabs = [['profile', 'Profil'], ['prefs', 'Tərcihlər'], ['docs', 'Sənədlər'], ['process', 'Proses'], ['msgs', 'Mesajlar'], ['appts', 'Görüşlər']];
  const body = { profile: cardProfile, prefs: cardPrefs, docs: cardDocs, process: cardProcess, msgs: cardMsgs, appts: cardAppts }[ui.ctab](B);
  return `<button class="lnk" data-act="closecard">← Bütün tələbələr</button>
  <div class="card"><div class="head"><div class="who">${av(p, 64)}<span><h1 style="font-size:24px;font-weight:800">${esc(fullName(p))}</h1>
    <div class="chips" style="margin-top:6px">${pill('info', p.student_code || '')}${pill(p.access_active ? 'ok' : 'bad', p.access_active ? 'Portala giriş aktiv' : 'Giriş bağlıdır')}${pill(c.missing ? 'bad' : 'ok', c.ready + '/' + B.docs.length + ' sənəd hazır')}</div></span></div>
    <div class="row"><button class="btn ghost" data-act="preview">${ic('eye', 18)}Tələbə kimi bax</button><button class="btn ghost sm" data-act="resetpw">Yeni parol ver</button></div></div>
    <div class="stepper">${STAGE_SHORT.map((s, i) => `<div class="${i + 1 < stage ? 'done' : i + 1 === stage ? 'now' : ''}"><i></i>${s}</div>`).join('')}</div></div>
  <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${ui.ctab === k}" data-act="ctab" data-v="${k}">${t}</button>`).join('')}</div>${body}`;
}
function cardProfile(B) {
  const p = B.p;
  const f = (k, label, type = 'text', full) => `<label class="f" ${full ? 'style="grid-column:1/-1"' : ''}>${label}<input class="inp" type="${type}" value="${esc(p[k] || '')}" data-pf="${k}" id="pf-${k}"></label>`;
  return `${B.creq.map(r => `<div class="banner"><span>Tələbənin düzəliş tələbi: “${esc(r.message)}”</span><button class="btn sm ghost" data-act="resolvereq" data-id="${r.id}">Həll edildi</button></div>`).join('')}
  <div class="cols"><div class="card"><h2>Şəxsi profil</h2><div class="grid3">${f('first_name', 'Ad')}${f('last_name', 'Soyad')}${f('birth_date', 'Doğum tarixi', 'date')}${f('father_name', 'Ata adı')}${f('mother_name', 'Ana adı')}${f('phone', 'Əlaqə nömrəsi')}${f('parent_phone', 'Valideyn nömrəsi')}${f('contract_signed_at', 'Müqavilə tarixi', 'date')}${f('registration_address', 'Qeydiyyat ünvanı', 'text', 1)}</div>
    <label class="chk"><input type="checkbox" data-pf="access_active" ${p.access_active ? 'checked' : ''}>Portala giriş açıqdır</label>
    <p class="note">Dəyişikliklər xanadan çıxanda avtomatik yadda saxlanılır.</p></div>
  <div class="card" style="flex:0 1 260px;align-items:center;text-align:center"><h2>Profil şəkli</h2>${av(p, 120)}
    <label class="btn ghost sm">${ic('cam', 16)}Şəkil yüklə<input type="file" accept="image/*" class="sr" data-photo="${p.id}"></label></div></div>
  ${privacyCard(B, true)}`;
}
function uniOptions(country, selName) {
  const us = C.unis.filter(u => u.country === country);
  return us.map(u => `<option value="${esc(u.name)}" ${u.name === selName ? 'selected' : ''}>${esc(uniLabel(u))}</option>`).join('') + (us.some(u => u.name === selName) ? '' : `<option value="" selected>${selName ? esc(selName) + ' (kataloqda yoxdur)' : 'Seç'}</option>`);
}
function cardPrefs(B) {
  const pr = B.pref, tk = B.tk;
  return `<div class="cols"><div class="card"><h2>Təhsil istiqaməti</h2><div class="grid2">
    <label class="f">Ölkə<select class="inp" data-sp="country"><option value="">Seç</option>${COUNTRIES.map(c => `<option ${c === pr.country ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <label class="f">Təhsil dərəcəsi<select class="inp" data-sp="degree"><option value="">Seç</option>${Object.entries(DEGREES).map(([k, v]) => `<option value="${k}" ${k === pr.degree ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f">Qəbul ili<input class="inp" type="number" value="${esc(pr.intake_year || '')}" data-sp="intake_year"></label>
    <label class="f">Təhsil dili<input class="inp" value="${esc(pr.study_language || '')}" data-sp="study_language"></label></div>
    <span class="lbl">Universitet və ixtisas · üstünlük sırası ilə</span>
    ${B.choices.map((c, i) => { const u = C.unis.find(x => x.name === c.university_name && x.country === pr.country); return `<div class="row" style="align-items:flex-end">
      <span class="pill p-info" style="min-width:28px;justify-content:center">${i + 1}</span>
      <label class="f" style="flex:2 1 220px">Universitet<select class="inp" data-ch="uni" data-i="${i}">${uniOptions(pr.country, c.university_name)}</select></label>
      <label class="f" style="flex:1 1 160px">İxtisas<select class="inp" data-ch="program" data-i="${i}">${progOptions(u ? (C.progs[u.id] || []) : [], pr.degree, c.program_name)}</select></label>
      <button class="btn sm bad" data-act="chdel" data-i="${i}">Sil</button></div>`; }).join('') || '<div class="empty">Tərcih yoxdur</div>'}
    ${B.choices.length < 5 ? `<button class="btn soft sm" data-act="chadd" ${pr.country ? '' : 'disabled'} style="align-self:flex-start">${ic('plus', 16)}Tərcih əlavə et</button>` : ''}
    ${B.wish.length ? `<span class="lbl">Tələbənin bəyəndikləri · ${B.wish.length}</span><div class="list">${B.wish.map(w => { const u = C.unis.find(x => x.id === w.university_id) || {}; const inCh = B.choices.some(c => c.university_name === u.name && c.program_name === w.program_name); return `<div class="row" style="justify-content:space-between"><span><b style="font-size:13px">${esc(w.program_name)}</b><br><span class="note">${esc([u.name, u.city, DEGREES[w.degree]].filter(Boolean).join(' · '))}</span></span>${inCh ? pill('ok', 'Tərcihdədir') : `<button class="btn sm" data-act="wishadd" data-id="${w.id}">Tərcihə əlavə et</button>`}</div>`; }).join('')}</div>` : ''}
    <p class="note">Ölkə və dərəcə seçiləndə lazımi sənəd siyahısı avtomatik yaranır. 1-ci tərcihə görə tələbə qruplara düşür.</p></div>
  <div class="card" style="flex:0 1 320px"><h2>Türk dili</h2>
    ${tk.wants_to_join ? `<div class="banner"><span>Tələbə kursa yazılmaq istəyir</span><button class="btn sm" data-act="tkadd">Kursa əlavə et</button></div>` : ''}
    <label class="f">Hazırlıq<select class="inp" data-tk="mode">${Object.entries(TK).map(([k, v]) => `<option value="${k}" ${k === tk.mode ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f">Qrup<input class="inp" value="${esc(tk.group_label || '')}" data-tk="group_label" placeholder="Onlayn · A2"></label>
    <label class="f">Səviyyə<select class="inp" data-tk="level">${['', 'A1', 'A2', 'B1', 'B2', 'C1'].map(l => `<option value="${l}" ${l === (tk.level || '') ? 'selected' : ''}>${l || '—'}</option>`).join('')}</select></label></div></div>`;
}
function cardDocs(B) {
  const sel = (d, k, label) => d[k] === 'not_required' ? `<span class="note">Lazım deyil</span>` :
    `<div style="display:flex;flex-direction:column;gap:4px"><select class="inp sm" data-df="${k}" data-doc="${d.id}" aria-label="${label}"><option value="pending" ${d[k] === 'pending' ? 'selected' : ''}>Gözlənilir</option><option value="done" ${d[k] === 'done' ? 'selected' : ''}>Hazır</option></select>${d[k] === 'done' ? `<input class="inp sm" type="date" value="${d[k + '_done_at'] || ''}" data-df="${k}_done_at" data-doc="${d.id}" aria-label="${label} tarixi">` : ''}</div>`;
  return `<div class="card"><div><h2>Sənəd qeydiyyatı</h2><div class="sub">Orijinal alındı → skan → tərcümə → notarial → apostil → geri təhvil. Status avtomatik hesablanır.</div></div>

function readImage(file, max, cb) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(cb, 'image/jpeg', .85); }; img.onerror = () => toast('Şəkli oxumaq alınmadı'); img.src = r.result; };
  r.readAsDataURL(file);
}

    const ann = document.getElementById('gann').checked;
    await q(sb.from('group_messages').insert({ group_id: ui.grp, sender_id: C.me.id, body: text, is_announcement: ann }));
    if (ann) { const g = C.groups.find(x => x.id === ui.grp); if (g.group_members.length) await q(sb.from('notifications').insert(g.group_members.map(m => ({ user_id: m.user_id, title: 'Qrupda yeni elan', body: text, sent_by: C.me.id })))); }
    await loadGroupChat(ui.grp); render(); scrollChat(); toast('Göndərildi');
  },
  unidel: async (d, el) => { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Əminsən? Bas'; return; } await q(sb.from('universities').delete().eq('id', d.id)); await loadUnis(); render(); toast('Silindi'); },
  logodel: async () => { await q(sb.from('app_settings').update({ logo_url: null }).eq('id', 1)); await loadSettings(); render(); },
  /* tələbə */
  stab: async d => { ui.stab = d.v; render();
    if (d.v === 'amb') { await Promise.all([loadAmbCards(), loadMyAmbThreads()]); render(); window.scrollTo(0, 0); return; }
    if (d.v === 'search') { if (!ui.srch) ui.srch = { q: '', deg: (C.bundle && C.bundle.pref.degree) || '', city: '', type: '' }; await Promise.all([C.unis.length ? null : loadUnis(), loadAllProgs(), loadWish()]); render(); window.scrollTo(0, 0); return; }
    if (d.v === 'group') { await reloadPortal(); render(); scrollChat(); } else if (d.v === 'notifs' && !ui.preview) { await q(sb.from('notifications').update({ read_at: new Date().toISOString() }).eq('user_id', C.me.id).is('read_at', null)); } else if (d.v === 'support') scrollChat(); window.scrollTo(0, d.v === 'support' ? document.body.scrollHeight : 0); },
  docf: d => { ui.docf = d.v; render(); },
  btype: d => { ui.book.type = d.v; render(); }, bday: d => { ui.book.day = d.v; ui.book.time = null; render(); }, btime: d => { ui.book.time = d.v; render(); },
  book: async () => { if (ui.preview) return toast('Önizləmədə görüş göndərilmir'); await q(sb.from('appointments').insert({ student_id: C.me.id, type: ui.book.type, starts_at: new Date(ui.book.day + 'T' + ui.book.time + ':00+04:00').toISOString() })); ui.book.time = null; await reloadPortal(); render(); toast('Görüş sorğun göndərildi'); },
  ssend: async () => { if (ui.preview) return toast('Önizləmədə mesaj göndərilmir'); const el = document.getElementById('smsg'), text = el.value.trim(); if (!text) return; await q(sb.from('support_messages').insert({ student_id: C.me.id, sender_id: C.me.id, body: text })); await reloadPortal(); render(); scrollChat(); const n = document.getElementById('smsg'); if (n) n.focus(); },
  req: async () => { if (ui.preview) return; const t = document.getElementById('reqTxt').value.trim(); if (!t) return toast('Nəyin səhv olduğunu yaz'); await q(sb.from('profile_change_requests').insert({ student_id: C.me.id, message: t })); await reloadPortal(); render(); toast('Sorğu göndərildi'); },
  tkjoin: async () => { await q(sb.rpc('request_turkish_course')); await reloadPortal(); render(); toast('Sorğun göndərildi'); },
  gtab: async d => { ui.gtab = d.v; await reloadPortal(); render(); scrollChat(); },
  gaccept: async d => { await q(sb.from('group_members').update({ rules_accepted_at: new Date().toISOString() }).eq('group_id', d.id).eq('user_id', C.me.id)); await reloadPortal(); render(); scrollChat(); toast('Qrupa qoşuldun'); },
  gpost: async d => { const el = document.getElementById('gpost'), text = el.value.trim(); if (!text) return; await q(sb.from('group_messages').insert({ group_id: d.id, sender_id: C.me.id, body: text })); await loadGroupChat(d.id); render(); scrollChat(); const n = document.getElementById('gpost'); if (n) n.focus(); }
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'scrim') e.preventDefault();
  if (ui.busy && el.dataset.act !== 'scrim') return;
  ui.busy = true;
  try { await fn(el.dataset, el, e); } catch (err) { console.error(err); } finally { ui.busy = false; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACT.openst(e.target.dataset);
  if (e.key === 'Enter' && e.target.id === 'smsg') ACT.ssend();
  if (e.key === 'Enter' && e.target.id === 'ambmsg' && e.target.tagName === 'INPUT' && !ui.busy) { ui.busy = true; ACT.ambsend().finally(() => { ui.busy = false; }); }
  if (e.key === 'Enter' && e.target.id === 'gpost') { const b = document.querySelector('[data-act="gpost"]'); if (b) ACT.gpost(b.dataset); }
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'srchq') { ui.srch.q = e.target.value; clearTimeout(ui.srchT); ui.srchT = setTimeout(() => { const box = document.getElementById('srchres'); if (box) box.innerHTML = searchResults(); }, 150); }
  if (e.target.id === 'q') { const v = e.target.value.toLowerCase().trim(); document.querySelectorAll('tr[data-hay]').forEach(tr => tr.hidden = v && !tr.dataset.hay.includes(v)); }
  if (e.target.dataset.set === 'brand_color' || e.target.dataset.set === 'accent_color') { C.settings[e.target.dataset.set] = e.target.value; applyBrand(); }
});
function fillUniSelects() {
  const country = document.getElementById('nf-country').value, ty = document.getElementById('nf-utype').value;
  const us = C.unis.filter(u => u.country === country && (!ty || u.type === ty));
  [0, 1, 2].forEach(i => { document.getElementById('nf-uni' + i).innerHTML = `<option value="">${country ? 'Seç' : 'Əvvəlcə ölkəni seç'}</option>` + us.map(u => `<option value="${u.id}">${esc(uniLabel(u))}</option>`).join(''); document.getElementById('nf-prog' + i).innerHTML = '<option value="">—</option>'; });
}
async function fillProgSelect(i) {
  const uid = document.getElementById('nf-uni' + i).value, deg = document.getElementById('nf-degree').value, el = document.getElementById('nf-prog' + i);
  if (!uid) { el.innerHTML = '<option value="">—</option>'; return; }
  el.innerHTML = '<option value="">Yüklənir…</option>';
  el.innerHTML = progOptions(await loadProgs(uid), deg, '');
}
document.addEventListener('toggle', async e => {
  const d = e.target;
  if (d.matches && d.matches('details[data-ambcard]')) { if (d.open) ui.ambOpen = d.dataset.ambcard; else if (ui.ambOpen === d.dataset.ambcard) ui.ambOpen = null; return; } if (!d.matches || !d.matches('details[data-uni]') || !d.open) return;
  const box = d.querySelector('.progbox'); if (box.dataset.done) return;
  const list = await loadProgs(d.dataset.uni); box.dataset.done = '1';
  box.innerHTML = ['associate', 'bachelor', 'master', 'doctorate'].map(g => { const L = list.filter(p => p.degree === g); return L.length ? `<div style="margin-bottom:10px"><span class="lbl">${DEGREES[g]} · ${L.length}</span><div class="chips" style="margin-top:6px">${L.map(p => `<span class="pill p-mut" title="${esc([p.language, p.years ? p.years + ' il' : '', fee(p.annual_fee)].filter(Boolean).join(' · '))}">${esc(p.name + (p.thesis ? ' · ' + p.thesis : ''))}</span>`).join('')}</div></div>` : ''; }).join('') || 'İxtisas yoxdur';
}, true);
document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset;
  try {
    if (t.id === 'nf-country' || t.id === 'nf-utype') return fillUniSelects();
    if (t.id === 'nf-degree') { for (const i of [0, 1, 2]) await fillProgSelect(i); return; }
    if (ds.nfuni !== undefined) return fillProgSelect(+ds.nfuni);
    if (ds.srch) { ui.srch[ds.srch] = t.value; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (ds.amb) {
      const k = ds.amb, num = ['study_year', 'since_year', 'sort_order'].includes(k);
      let v = t.type === 'checkbox' ? t.checked : num ? (t.value === '' ? (k === 'sort_order' ? 0 : null) : +t.value) : (t.value.trim() || null);
      if (k === 'city' && !v) { toast('Şəhər boş ola bilməz'); return render(); }
      await q(sb.from('ambassadors').update({ [k]: v }).eq('id', ds.id)); ui.ambOpen = ds.id; await loadAmbAdmin(); render(); return toast('Yadda saxlanıldı');
    }
    if (ds.set) { await q(sb.from('app_settings').update({ [ds.set]: t.value, updated_at: new Date().toISOString() }).eq('id', 1)); await loadSettings(); render(); return toast('Yadda saxlanıldı'); }
    if (t.id === 'logoInput') { const f = t.files[0]; if (!f) return; const path = 'logo-' + Date.now() + '-' + safeName(f.name); await q(sb.storage.from('branding').upload(path, f, { upsert: true, contentType: f.type })); const url = sb.storage.from('branding').getPublicUrl(path).data.publicUrl; await q(sb.from('app_settings').update({ logo_url: url }).eq('id', 1)); await loadSettings(); render(); return toast('Logo yeniləndi'); }
    if (ds.photo) { if (ui.preview) return toast('Önizləmədə şəkil dəyişmir'); return readImage(t.files[0], 400, async blob => { const path = ds.photo + '/avatar-' + Date.now() + '.jpg'; await q(sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' })); await q(sb.from('profiles').update({ avatar_path: path }).eq('id', ds.photo)); if (C.detail && C.detail.p.id === ds.photo) await reloadDetail(); if (C.bundle && C.bundle.p.id === ds.photo) await reloadPortal(); if (isStaff()) await loadStudents(); if (isStaff() && ui.atab === 'ambs') await loadAmbAdmin(); if (isAmb()) { await loadMe(); await loadAmbInbox(); } render(); toast('Şəkil yeniləndi'); }); }
    if (!C.detail) return;
    const B = C.detail;
    if (ds.pf) { const v = t.type === 'checkbox' ? t.checked : (t.value || null); await q(sb.from('profiles').update({ [ds.pf]: v }).eq('id', ui.open)); await reloadDetail(); if (ds.pf === 'first_name' || ds.pf === 'last_name' || ds.pf === 'access_active') render(); return toast('Yadda saxlanıldı'); }
    if (ds.sp) {
      const v = ds.sp === 'intake_year' ? (+t.value || null) : (t.value || null);
      const before = B.docs.length;
      await q(sb.from('study_preferences').update({ [ds.sp]: v }).eq('student_id', ui.open));
      await reloadDetail(); render();
      const added = C.detail.docs.length - before;
      return toast(added > 0 ? added + ' sənəd siyahıya avtomatik əlavə olundu' : 'Yadda saxlanıldı');
    }
    if (ds.ch) {
      const c = B.choices[+ds.i];
      if (ds.ch === 'uni') { const u = C.unis.find(x => x.name === t.value && x.country === B.pref.country); if (!u) return; const list = await loadProgs(u.id); await q(sb.from('program_choices').update({ university_name: u.name, city: u.city, program_name: firstProg(list, B.pref.degree) || c.program_name }).eq('id', c.id)); }
      else await q(sb.from('program_choices').update({ program_name: t.value }).eq('id', c.id));
      await reloadDetail(); render(); return toast('Yadda saxlanıldı');
    }
    if (ds.tk) { const patch = { [ds.tk]: t.value || null }; if (ds.tk === 'mode') patch.wants_to_join = false; await q(sb.from('turkish_language').update(patch).eq('student_id', ui.open)); await reloadDetail(); render(); return toast('Yadda saxlanıldı'); }
    if (ds.df) {
      const d = B.docs.find(x => x.id === ds.doc), was = docStatus(d), patch = { [ds.df]: t.value || null };
      if (['translation', 'notary', 'apostille'].includes(ds.df) && t.value === 'done' && !d[ds.df + '_done_at']) patch[ds.df + '_done_at'] = todayISO();
      if (ds.df === 'original_returned_at') patch.return_status = t.value ? 'returned' : 'in_office';
      if (ds.df === 'original_received_at') patch.return_status = t.value ? (docReturnable(d) ? 'in_office' : 'not_returnable') : 'not_received';
      const next = Object.assign({}, d, patch), is = docStatus(next); patch.status = is;
      await q(sb.from('student_documents').update(patch).eq('id', d.id));
      if (was !== 'ready' && is === 'ready') await notify(ui.open, 'Sənədin hazırdır', docName(d));
      else if (ds.df === 'original_received_at' && t.value && was === 'missing') await notify(ui.open, 'Sənədin qəbul edildi', docName(d) + ' · ' + fmt(t.value));
      await reloadDetail(); render(); return toast(is !== was ? 'Status: ' + DS[is][1] : 'Yadda saxlanıldı');
    }
    if (ds.docfile) {
      const f = t.files[0]; if (!f) return;
      if (f.size > 20 * 1024 * 1024) return toast('Fayl 20 MB-dan böyük olmamalıdır');
      toast('Yüklənir…');
      const path = ui.open + '/' + Date.now() + '-' + safeName(f.name);
      await q(sb.storage.from('documents').upload(path, f, { contentType: f.type || 'application/octet-stream' }));
      await q(sb.from('document_files').insert({ student_document_id: ds.docfile, student_id: ui.open, storage_path: path, file_name: f.name, mime_type: f.type, size_bytes: f.size, uploaded_by: C.me.id }));
      await notify(ui.open, 'Sənədin skanı yükləndi', docName(B.docs.find(x => x.id === ds.docfile)));
      await reloadDetail(); render(); return toast('Skan yükləndi');
    }
  } catch (err) { console.error(err); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  try {
    if (form.id === 'loginForm') {
      const err = document.getElementById('lg-err'); err.hidden = true;
      const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('lg-email').value.trim(), password: document.getElementById('lg-pass').value });
      if (error) { err.textContent = 'E-poçt və ya parol səhvdir.'; err.hidden = false; return; }
      await boot(); return;
    }
    if (form.id === 'consentForm') {
      const err = document.getElementById('cs-err'), g = document.getElementById('cs-guardian');
      const items = { processing: document.getElementById('cs-1').checked, cross_border: document.getElementById('cs-2').checked, guardian: !!g };
      if (!items.processing || !items.cross_border || (g && (!g.value.trim() || !document.getElementById('cs-3').checked))) { err.textContent = 'Davam etmək üçün bütün xanaları işarələ.'; err.hidden = false; return; }
      const text = [...form.querySelectorAll('h2, p.note:not(#cs-err), .list > div, label.chk span, .banner span')].map(el => el.innerText.trim()).filter(Boolean).join('\n');
      const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      const rec = await q(sb.rpc('accept_consent', { p_version: PRIVACY_VERSION, p_items: items, p_guardian: g ? g.value : null, p_ua: navigator.userAgent, p_text: text })).finally(() => { btn.disabled = false; });
      C.myConsent = rec; if (C.bundle) C.bundle.consent = rec;
      ui.consentDone = rec; render(); if (!C.bundle) { await reloadPortal(); if (!ui.consentDone) render(); } return;
    }
    if (form.id === 'recoverForm') {
      const p = document.getElementById('rc-pass').value, err = document.getElementById('rc-err');
      if (p.length < 8 || p !== document.getElementById('rc-pass2').value) { err.textContent = p.length < 8 ? 'Parol ən azı 8 simvol olmalıdır.' : 'Parollar eyni deyil.'; err.hidden = false; return; }
      const { error } = await sb.auth.updateUser({ password: p });
      if (error) { err.textContent = 'Xəta: ' + error.message; err.hidden = false; return; }
      ui.recovering = false; history.replaceState(null, '', location.pathname); toast('Parol yeniləndi'); await boot(); return;
    }
    if (form.id === 'pwForm') {
      const v = document.getElementById('newpw').value; if (v.length < 8) return toast('Parol ən azı 8 simvol olmalıdır');
      const { error } = await sb.auth.updateUser({ password: v }); if (error) return toast('Xəta: ' + error.message);
      form.reset(); return toast('Parol dəyişdirildi');
    }
    if (form.id === 'newForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('nf-err');
      if (!v('email') || !v('first_name') || !v('last_name')) { err.textContent = 'E-poçt, ad və soyadı doldur.'; err.hidden = false; return; }
      const choices = [0, 1, 2].map(i => { const u = C.unis.find(x => x.id === v('uni' + i)); return u ? { university_name: u.name, city: u.city, program_name: v('prog' + i) || firstProg(C.progs[u.id] || [], v('degree')) || '—' } : null; }).filter(Boolean);
      const btn = document.getElementById('nf-submit'); btn.disabled = true; btn.textContent = 'Yaradılır…';
      const body = { email: v('email'), first_name: v('first_name'), last_name: v('last_name'), father_name: v('father_name'), mother_name: v('mother_name'), birth_date: v('birth_date') || null, phone: v('phone'), parent_phone: v('parent_phone'), registration_address: v('registration_address'), contract_signed_at: v('contract_signed_at') || null, country: v('country') || null, degree: v('degree') || null, intake_year: +v('intake_year') || null, turkish_mode: v('turkish_mode'), choices };
      const r = await sb.functions.invoke('create-student', { body });
      const msg = r.data && r.data.error ? r.data.error : r.error ? (await (async () => { try { const j = await r.error.context.json(); return j.error; } catch (x) { return r.error.message; } })()) : null;
      if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Tələbəni yarat və giriş ver'; return; }
      ui.modal = null; ui.created = { title: body.first_name + ' ' + body.last_name + ' yaradıldı · ' + (r.data.student_code || ''), email: r.data.email, temp_password: r.data.temp_password };
      await loadStudents(); ui.open = r.data.id; ui.ctab = 'docs'; C.detail = await loadBundle(r.data.id); render(); return;
    }
    if (form.id === 'ambForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim(), err = document.getElementById('na-err');
      if (!v('email') || !v('first_name') || !v('last_name') || !v('city')) { err.textContent = 'E-poçt, ad, soyad və şəhəri doldur.'; err.hidden = false; return; }
      const btn = document.getElementById('na-submit'); btn.disabled = true; btn.textContent = 'Yaradılır…';
      const body = { action: 'create_ambassador', email: v('email'), first_name: v('first_name'), last_name: v('last_name'), phone: v('phone') || null, city: v('city'), university_name: v('university_name') || null, program: v('program') || null, degree: v('degree') || null, study_year: +v('study_year') || null, since_year: +v('since_year') || null, languages: v('languages') || null, bio: v('bio') || null };
      const r = await sb.functions.invoke('create-student', { body });
      const msg = r.data && r.data.error ? r.data.error : r.error ? (await (async () => { try { const j = await r.error.context.json(); return j.error; } catch (x) { return r.error.message; } })()) : null;
      if (msg) { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Səfiri yarat'; return; }
      ui.modal = null; ui.created = { title: body.first_name + ' ' + body.last_name + ' səfir kimi əlavə olundu', email: r.data.email, temp_password: r.data.temp_password, who: 'səfirə' };
      ui.ambOpen = r.data.id; await loadAmbAdmin(); render(); return;
    }
    if (form.id === 'uniForm') {
      const f = new FormData(form), v = k => (f.get(k) || '').toString().trim();
      const programs = v('programs').split(',').map(s => s.trim()).filter(Boolean);
      if (!v('name') || !v('city') || !programs.length) return toast('Bütün xanaları doldur');
      const row = await q(sb.from('universities').insert({ country: v('country'), name: v('name'), city: v('city'), type: v('type'), programs: [] }).select().single());
      await q(sb.from('university_programs').insert(programs.map(n => ({ university_id: row.id, degree: v('degree'), name: n, source: 'Diplomax tərəfindən əlavə edilib' }))));
      await loadUnis(); render(); return toast('Universitet əlavə olundu');
    }
  } catch (err) { console.error(err); }
});

async function boot() {
  try {
    await loadSettings();
    await loadMe();
    if (C.me && !C.me.access_active && !isStaff()) { await sb.auth.signOut(); C.me = null; render(); return toast('Portala girişiniz bağlanıb. Menecerinizlə əlaqə saxlayın.'); }
    if (C.me && isStaff()) { await Promise.all([loadStudents(), loadUnis()]); }
    else if (C.me && isAmb()) { await loadAmbInbox(); }
    else if (C.me) { await loadMyConsent(); render(); if (consentOk(C.myConsent)) await reloadPortal(); }
    render();
  } catch (e) { console.error(e); app().innerHTML = '<div class="login"><div class="card"><h2>Bağlantı xətası</h2><p class="note">Səhifəni yeniləyin. Problem davam edərsə, Diplomax ilə əlaqə saxlayın.</p></div></div>'; }
}
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { ui.recovering = true; setTimeout(renderRecovery, 0); } });
if (/type=recovery/.test(location.hash)) { ui.recovering = true; renderRecovery(); }
else boot();
</script>
